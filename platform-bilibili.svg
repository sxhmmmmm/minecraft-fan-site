<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <g shape-rendering="crispEdges" fill="#ffffff">
    <!-- Bilibili TV mascot face -->
    <!-- Top bar -->
    <rect x="6" y="4" width="20" height="2" fill="#ffffff"/>
    <rect x="4" y="6" width="4" height="2" fill="#ffffff"/>
    <rect x="24" y="6" width="4" height="2" fill="#ffffff"/>
    <!-- Left eye -->
    <rect x="8" y="10" width="6" height="6" fill="#ffffff"/>
    <rect x="10" y="12" width="2" height="2" fill="#1b2e24"/>
    <!-- Right eye -->
    <rect x="18" y="10" width="6" height="6" fill="#ffffff"/>
    <rect x="20" y="12" width="2" height="2" fill="#1b2e24"/>
    <!-- Mouth/smile -->
    <rect x="12" y="20" width="8" height="2" fill="#ffffff"/>
    <rect x="10" y="22" width="2" height="2" fill="#ffffff"/>
    <rect x="20" y="22" width="2" height="2" fill="#ffffff"/>
    <!-- Antennae -->
    <rect x="10" y="2" width="2" height="2" fill="#ffffff"/>
    <rect x="20" y="2" width="2" height="2" fill="#ffffff"/>
  </g>
</svg>
