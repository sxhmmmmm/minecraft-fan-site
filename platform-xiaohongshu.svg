<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <g shape-rendering="crispEdges">
    <!-- Red book icon -->
    <rect x="6" y="4" width="20" height="24" rx="2" fill="#ff2442"/>
    <rect x="8" y="6" width="16" height="20" fill="#ff4462"/>
    <!-- Book spine line -->
    <rect x="14" y="4" width="4" height="24" fill="#e01e3a"/>
    <!-- White text lines suggesting a book page -->
    <rect x="10" y="10" width="3" height="2" fill="#ffffff"/>
    <rect x="10" y="14" width="4" height="2" fill="#ffffff"/>
    <rect x="10" y="18" width="3" height="2" fill="#ffffff"/>
    <!-- Right page lines -->
    <rect x="19" y="10" width="3" height="2" fill="#ffffff"/>
    <rect x="18" y="14" width="4" height="2" fill="#ffffff"/>
    <rect x="19" y="18" width="3" height="2" fill="#ffffff"/>
  </g>
</svg>
